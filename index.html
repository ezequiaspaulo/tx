<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tx Produções - Rastreamento</title>

    <meta name="theme-color" content="#ff8800">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SwcXP0V5/tx.jpg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <div id="splashScreen">
        <img id="splashLogo" src="https://i.ibb.co/SwcXP0V5/tx.jpg" alt="TX Logo">
    </div>

    <h1>Tx Produções - Rastreamento</h1>

    <button id="openMenuBtn" class="menu-btn">☰ Histórico</button>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3>Minhas Rotas</h3>
                <button id="closeSidebarBtn" class="close-btn">✖</button>
            </div>
            
            <div style="padding-bottom: 15px; border-bottom: 1px solid rgba(255,136,0,0.3); margin-bottom: 15px;">
                <button id="logoutBtn" class="logout-btn">Sair do App</button>
            </div>

            <div id="listaRotas" class="lista-rotas">
                <p style="color: #666; font-size: 13px;">Carregando histórico...</p>
            </div>
        </div>
    </div>

    <div class="overlay" id="loginOverlay">
        <img src="https://i.ibb.co/SwcXP0V5/tx.jpg" alt="TX Logo Fundo" class="login-background-image">
        
        <div class="login-box">
            <h2>Equipe TX</h2>
            <form id="loginForm">
                <label for="loginUser">E-mail</label>
                <input type="email" id="loginUser" placeholder="seu@email.com" required>
                
                <label for="loginPass">Senha</label>
                <input type="password" id="loginPass" placeholder="Senha" required>
                
                <button type="submit" id="loginBtn">Entrar</button>
            </form>
        </div>
    </div>

    <div id="map"></div>
    <div id="status" class="status">Aguardando...</div>
    <div id="timerDisplay" class="timer"></div>
    
    <button id="onlineToggle" class="online-toggle-btn">Ligar/Desligar</button>

    <div id="routeControl">
        <button id="mainButton">Iniciar</button>
        <button id="endButton">Encerrar</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
