<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tx Produções - Rastreamento</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="splashScreen">
        <img id="splashLogo" src="https://i.ibb.co/SwcXP0V5/tx.jpg" alt="TX Logo">
    </div>

    <h1>Tx Produções - Rastreamento</h1>

    <div class="overlay" id="loginOverlay">
        <img src="https://i.ibb.co/SwcXP0V5/tx.jpg" alt="TX Logo Fundo" class="login-background-image">
        
        <div class="login-box">
            <h2>Equipe TX</h2>
            <form id="loginForm">
                <label for="loginUser">E-mail</label>
                <input type="email" id="loginUser" placeholder="seu@email.com" required>
                
                <label for="loginPass">Senha</label>
                <input type="password" id="loginPass" placeholder="Senha" required>
                
                <button type="submit" id="loginBtn">Entrar</button>
            </form>
            
            <p id="loginError" style="color: #ff3333; font-weight: bold; font-size: 14px; margin-top: 15px; display: none;"></p>
        </div>
    </div>

    <div id="map"></div>
    <div id="status" class="status">Aguardando...</div>
    <div id="timerDisplay" class="timer"></div>
    
    <button id="onlineToggle" class="online-toggle-btn">Ligar/Desligar</button>

    <div id="routeControl">
        <button id="mainButton">Iniciar</button>
        <button id="endButton">Encerrar</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
