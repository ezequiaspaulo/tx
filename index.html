<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe TX - Acesso</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Supabase CDN (Caso não esteja usando via NPM) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <div class="login-box">
            
            <!-- ÁREA DE LOGIN -->
            <div id="loginSection">
                <h2>Equipe TX</h2>
                <form id="loginForm">
                    <label for="loginUser">E-mail</label>
                    <input type="email" id="loginUser" placeholder="seu@email.com" required>
                    
                    <label for="loginPass">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPass" placeholder="Senha" required>
                        <span class="toggle-pwd" id="toggleLoginPass">👁️</span>
                    </div>
                    
                    <button type="submit" id="loginBtn">Entrar</button>
                    <p class="switch-form">Não tem uma conta? <a href="#" id="showRegisterBtn">Cadastre-se</a></p>
                </form>
            </div>

            <!-- ÁREA DE CADASTRO -->
            <div id="registerSection" style="display: none;">
                <h2>Crie sua conta</h2>
                <p class="subtitle">Acesse sua área exclusiva em poucos segundos.</p>
                <form id="registerForm">
                    <input type="text" id="regNome" placeholder="Nome completo" required>
                    <input type="email" id="regEmail" placeholder="seu@email.com" required>
                    <input type="tel" id="regTelefone" placeholder="Telefone (WhatsApp)" required>
                    
                    <div class="password-wrapper">
                        <input type="password" id="regPass" placeholder="Senha (Mín. 4 dígitos)" required>
                        <span class="toggle-pwd" id="toggleRegPass">👁️</span>
                    </div>
                    
                    <!-- Indicador de força -->
                    <div class="strength-container">
                        <div class="strength-text">Força da senha: <span id="strengthLabel">Muito curta</span></div>
                        <div class="strength-bar"><div id="strengthProgress"></div></div>
                    </div>

                    <div class="password-wrapper">
                        <input type="password" id="regPassConfirm" placeholder="Confirme sua senha" required>
                        <span class="toggle-pwd" id="toggleRegPassConfirm">👁️</span>
                    </div>
                    
                    <button type="submit" id="registerBtn">Finalizar Cadastro</button>
                    <p class="switch-form">Já possui conta? <a href="#" id="showLoginBtn">Voltar ao Login</a></p>
                </form>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
