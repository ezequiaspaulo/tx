<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe TX - Acesso</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="./imgs/tx.jpg">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div id="toastContainer" class="toast-container"></div>

    <div id="splashScreen">
        <img id="splashLogo" src="./imgs/tx.jpg" alt="Logo Equipe TX" style="max-width: 60%; opacity: 0;">
    </div>

    <div id="loginOverlay" class="container">
        <div class="login-box">
            
            <div id="loginSection">
                <h2>Equipe TX</h2>
                <form id="loginForm">
                    <label for="loginUser">E-mail</label>
                    <input type="email" id="loginUser" placeholder="seu@email.com" required>
                    
                    <label for="loginPass">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPass" placeholder="Senha" required>
                        <span class="toggle-pwd" id="toggleLoginPass">👁️</span>
                    </div>
                    
                    <button type="submit" id="loginBtn">Entrar</button>
                    <p class="switch-form">Não tem uma conta? <a href="#" id="showRegisterBtn">Cadastre-se</a></p>
                </form>
            </div>

            <div id="registerSection" style="display: none;">
                <h2>Crie sua conta</h2>
                <p class="subtitle">Acesse sua área exclusiva em poucos segundos.</p>
                <form id="registerForm">
                    <input type="text" id="regNome" placeholder="Nome completo" required>
                    <input type="email" id="regEmail" placeholder="seu@email.com" required>
                    <input type="tel" id="regTelefone" placeholder="Telefone (WhatsApp)" required>
                    
                    <div class="password-wrapper">
                        <input type="password" id="regPass" placeholder="Senha (Mín. 4 dígitos)" required>
                        <span class="toggle-pwd" id="toggleRegPass">👁️</span>
                    </div>
                    
                    <div class="strength-container">
                        <div class="strength-text">Força da senha: <span id="strengthLabel">Muito curta</span></div>
                        <div class="strength-bar"><div id="strengthProgress"></div></div>
                    </div>

                    <div class="password-wrapper">
                        <input type="password" id="regPassConfirm" placeholder="Confirme sua senha" required>
                        <span class="toggle-pwd" id="toggleRegPassConfirm">👁️</span>
                    </div>
                    
                    <button type="submit" id="registerBtn">Finalizar Cadastro</button>
                    <p class="switch-form">Já possui conta? <a href="#" id="showLoginBtn">Voltar ao Login</a></p>
                </form>
            </div>

        </div>
    </div>

    <button id="openMenuBtn" class="menu-btn">☰</button>
    <div id="status" class="status">Offline 🔴</div>
    <div id="timerDisplay" class="timer" style="display: none;">0:00</div>
    <button id="onlineToggle" class="online-toggle-btn" style="display: none;">Ficar Online</button>

    <div id="installBanner" class="install-banner" style="display: none;">
        <div class="install-text">
            <strong>Equipe TX</strong>
            <span>Baixe o app para melhor experiência</span>
        </div>
        <button id="installAppBtn">Baixar</button>
        <button id="closeInstallBanner" class="close-install">✖</button>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3>Equipe TX</h3>
                <button id="closeSidebarBtn" class="close-btn">✖</button>
            </div>
            <div id="listaRotas" class="lista-rotas"></div>
        </div>
        <button id="logoutBtn" class="logout-btn">Sair</button>
    </div>

    <div id="map"></div>

    <div id="routeControl">
        <button id="mainButton">Iniciar</button>
        <button id="endButton">Encerrar</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
